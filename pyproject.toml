[project]
name = "deep-research-adk"
version = "0.1.0"
description = "Multi-agent deep research system built on Google ADK with structured workspace, parallel researchers, source-quality stratification, and audited reasoning trail."
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.5.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_research", "tools"]
